- name: 'Remove SCM_RUN_FROM_PACKAGE y forzar Python 3.11'
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          USER=$(echo $PUBLISH_PROFILE | grep -oP '(?<=userName=")[^"]+')
          PASS=$(echo $PUBLISH_PROFILE | grep -oP '(?<=userPWD=")[^"]+')

          # Eliminar SCM_RUN_FROM_PACKAGE
          curl -s -X DELETE \
            -u "$USER:$PASS" \
            https://breezeac.scm.azurewebsites.net/api/settings/SCM_RUN_FROM_PACKAGE

          # Forzar versión de Python para Oryx
          curl -s -X POST \
            -u "$USER:$PASS" \
            -H "Content-Type: application/json" \
            -d '{"ORYX_PYTHON_PLATFORM_VERSION":"3.11"}' \
            https://breezeac.scm.azurewebsites.net/api/settings

          echo "Settings actualizados en breezeAc"

          # Verificar que quedaron bien
          echo "=== Settings actuales ==="
          curl -s -u "$USER:$PASS" \
            https://breezeac.scm.azurewebsites.net/api/settings \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print('ORYX_PYTHON_PLATFORM_VERSION:', s.get('ORYX_PYTHON_PLATFORM_VERSION','NO ENCONTRADO'))"